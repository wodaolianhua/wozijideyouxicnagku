<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 重做样本对照</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#11141b;color:#e8e4d8;font-family:"Microsoft YaHei",sans-serif}
    .wrap{display:flex;flex-direction:column;height:100%}
    header{padding:10px 16px;background:#0c0f15;border-bottom:1px solid #232a36}
    header b{color:#c9a44c}
    .grid{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0}
    .cell{display:flex;flex-direction:column;min-height:0;border-right:1px solid #232a36;border-bottom:1px solid #232a36}
    .cell:nth-child(2n){border-right:none}
    .cap{padding:8px 12px;font-size:13px;background:#161b24}
    .cap .big{color:#c9a44c;font-size:15px}
    .cap .old{color:#8a93a3}
    model-viewer{flex:1;width:100%;background:radial-gradient(circle at 50% 40%,#1b2230,#0c0f15);min-height:0}
    .bar{padding:6px 16px;font-size:12px;color:#9aa3b2;background:#0c0f15}
  </style>
</head>
<body>
  <div class="wrap">
    <header><b>AI 重做样本对照</b>：左=原代码模型　右=AI 文生 3D 重做版</header>
    <div class="grid">
      <div class="cell">
        <div class="cap"><span class="big old">城堡 · 代码版(原)</span></div>
        <model-viewer src="city_castle_code.glb" camera-controls auto-rotate
          shadow-intensity="1" exposure="1.1" environment-image="neutral" rotation-per-second="18deg">
          <div slot="poster">加载中…</div>
        </model-viewer>
      </div>
      <div class="cell">
        <div class="cap"><span class="big">城堡 · AI 重做版</span></div>
        <model-viewer src="castle_ai.glb" camera-controls auto-rotate
          shadow-intensity="1" exposure="1.1" environment-image="neutral" rotation-per-second="18deg">
          <div slot="poster">加载中…</div>
        </model-viewer>
      </div>
      <div class="cell">
        <div class="cap"><span class="big old">国王 · v1(黑皮肤,原)</span></div>
        <model-viewer src="monarch.glb" camera-controls auto-rotate
          shadow-intensity="1" exposure="1.1" environment-image="neutral" rotation-per-second="18deg">
          <div slot="poster">加载中…</div>
        </model-viewer>
      </div>
      <div class="cell">
        <div class="cap"><span class="big">国王 · v2(肤色修正)</span></div>
        <model-viewer src="monarch_v2.glb" camera-controls auto-rotate
          shadow-intensity="1" exposure="1.1" environment-image="neutral" rotation-per-second="18deg">
          <div slot="poster">加载中…</div>
        </model-viewer>
      </div>
    </div>
    <div class="bar">四个模型都可拖拽旋转、滚轮缩放。重点看：城堡代码素胚 vs AI 石头城堡；国王 v1 黑皮肤 vs v2 白皙肤色。</div>
  </div>
</body>
</html>
