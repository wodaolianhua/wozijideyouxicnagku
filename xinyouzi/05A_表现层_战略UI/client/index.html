<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>汉末战略 · 3D 双层视角</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        font-family: 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      }
      #scene-root {
        position: fixed;
        inset: 0;
      }
      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #hud-root > * {
        pointer-events: auto;
      }
      #boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c9a44c;
        font-size: 18px;
        letter-spacing: 4px;
        background: #0b0e14;
        z-index: 9999;
        transition: opacity 0.4s;
      }
    </style>
  </head>
  <body>
    <div id="scene-root"></div>
    <div id="hud-root"></div>
    <div id="boot-loading">正在生成天下……</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
