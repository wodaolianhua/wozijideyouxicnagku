<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文件工具箱 · 电脑版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>📁</text></svg>">
<style>
:root{
  --bg:#111318;--bg2:#181b22;--card:#1e222b;--card2:#262b36;
  --line:#2f3542;--line2:#3d4453;--tx:#e8eaf0;--tx2:#a2abbd;--tx3:#6f7889;
  --acc:#5b8cff;--accbg:#1c2740;--ok:#3ddc97;--warn:#ffb454;--bad:#ff6b6b;--purple:#a78bfa;
  --r:12px;--r2:9px;--sh:0 6px 22px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:14.5px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 70px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header h1{font-size:21px;margin:0;font-weight:600}
header p{margin:2px 0 0;color:var(--tx3);font-size:13px}
.badge{margin-left:auto;font-size:11.5px;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:4px 11px}

.tabs{display:flex;gap:6px;margin:20px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--tx3);
  padding:10px 15px;cursor:pointer;font-size:14.5px
}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:15.5px;margin:0 0 6px}
.card .desc{color:var(--tx2);font-size:13px;margin:0 0 14px}

.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.fl{display:block;font-size:12.5px;color:var(--tx2);margin:0 0 5px}

input[type=text],input[type=number],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);
  padding:9px 11px;outline:none;color:var(--tx);font:inherit
}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
textarea{resize:vertical;min-height:70px;font-family:inherit}

.btn{
  border:1px solid var(--line2);background:var(--card2);color:var(--tx);
  border-radius:var(--r2);padding:9px 15px;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap
}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.4;pointer-events:none}

.drop{
  border:2px dashed var(--line2);border-radius:var(--r);padding:30px 20px;text-align:center;
  color:var(--tx3);cursor:pointer;transition:.15s
}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--accbg);color:var(--tx2)}
.drop b{color:var(--tx);display:block;font-size:15px;margin-bottom:5px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--tx3);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--card)}
.tbl tr:hover td{background:var(--bg2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r2)}

.bar{height:7px;background:var(--card2);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .25s}

.msg{padding:10px 13px;border-radius:var(--r2);font-size:13.5px;margin-top:12px;display:none}
.msg.on{display:block}
.msg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.msg.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.msg.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 32%,transparent)}

.empty{text-align:center;color:var(--tx3);padding:34px 10px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx2);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mono{font-family:ui-monospace,Consolas,Menlo,monospace}
.tiny{font-size:12.5px}
.dim{color:var(--tx3)}
.muted{color:var(--tx2)}
.mt{margin-top:12px}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);color:var(--tx3);font-size:12.5px}
canvas.preview{max-width:150px;border-radius:8px;border:1px solid var(--line)}
.thumb{display:inline-block;margin:0 8px 8px 0}
.thumb img{max-width:110px;max-height:110px;border-radius:6px;border:1px solid var(--line);display:block}
.thumb .nm{font-size:11px;color:var(--tx3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>文件工具箱</h1>
      <p>电脑版 · 5 个跟文件打交道的工具。全部在你自己电脑里跑，不上传任何东西。</p>
    </div>
    <span class="badge" id="browserBadge"></span>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="panel"></div>

  <div class="foot">
    全部处理都在本机浏览器里完成，文件不会离开你的电脑。关掉页面就什么都不剩。
    <span id="hostNote"></span>
  </div>
</div>

<script src="js/rename-script.js"></script>
<script src="js/desktop.js"></script>
</body>
</html>
