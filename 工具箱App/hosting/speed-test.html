<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测速 · 工具箱</title>
<style>
:root{--bg:#111318;--card:#1e222b;--line:#2f3542;--tx:#e8eaf0;--tx2:#a2abbd;--tx3:#6f7889;--acc:#5b8cff;--ok:#3ddc97;--bad:#ff6b6b;--warn:#ffb454}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:24px 18px 60px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:21px;margin:0 0 6px}
.sub{color:var(--tx3);font-size:13.5px;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-weight:500}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
button{
  border:1px solid var(--line);background:#262b36;color:var(--tx);border-radius:9px;
  padding:11px 16px;font:inherit;cursor:pointer;width:100%
}
button:active{transform:scale(.98)}
.note{color:var(--tx3);font-size:12.5px;margin-top:10px;line-height:1.6}
.tag{display:inline-block;font-size:11px;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
</style>
</head>
<body>
<div class="wrap">
  <h1>工具箱 · 速度自测</h1>
  <p class="sub">打开这个页面的耗时，就是你手机打开 App 的耗时。<br>关掉 WiFi，用流量测，最准。</p>

  <div class="card">
    <h2>这次打开</h2>
    <div class="row"><span>页面加载</span><span class="num" id="load">—</span></div>
    <div class="row"><span>网络类型</span><span class="num" id="net">—</span></div>
    <div class="row"><span>建议</span><span class="num" id="verdict">—</span></div>
  </div>

  <div class="card">
    <h2>各托管平台对比</h2>
    <div class="row"><span>EdgeOne Pages（腾讯）</span><span class="num" id="t1">测速中…</span></div>
    <div class="row"><span>WorkBuddy 发布（腾讯）</span><span class="num" id="t2">测速中…</span></div>
    <div class="row"><span>Cloudflare Pages（备用）</span><span class="num" id="t3">测速中…</span></div>
    <p class="note">测的是各平台首页的响应时间。结果只作参考，最终以实际打开 App 的手感为准。</p>
  </div>

  <button onclick="location.reload()">重新测一次</button>
  <p class="note" style="text-align:center;margin-top:18px">这个页面本身不收集任何信息。</p>
</div>

<script>
(function(){
  var t0 = performance.now();
  window.addEventListener('load', function(){
    var d = Math.round(performance.now() - t0);
    document.getElementById('load').textContent = d + ' ms';
    document.getElementById('load').className = 'num ' + (d < 800 ? 'good' : d < 2000 ? 'warn' : 'bad');
    var conn = navigator.connection;
    document.getElementById('net').textContent = conn ? (conn.effectiveType || '未知') + (conn.saveData ? ' · 省流量' : '') : '未知';
    var v = document.getElementById('verdict');
    v.textContent = d < 800 ? '很快，够用' : d < 2000 ? '能用' : '太慢，得换';
    v.className = 'num ' + (d < 800 ? 'good' : d < 2000 ? 'warn' : 'bad');
  });

  var targets = [
    ['t1', 'https://pages.edgeone.ai/'],
    ['t2', 'https://www.workbuddy.cn/'],
    ['t3', 'https://pages.cloudflare.com/']
  ];
  targets.forEach(function(t){
    var s = performance.now();
    fetch(t[1], { mode:'no-cors', cache:'no-store' })
      .then(function(){ set(t[0], Math.round(performance.now()-s)); })
      .catch(function(){ set(t[0], '不通'); });
  });
  function set(id, v){
    var e = document.getElementById(id);
    e.textContent = v;
    e.className = 'num ' + (typeof v === 'number' ? (v < 600 ? 'good' : v < 1500 ? 'warn' : 'bad') : 'bad');
  }
})();
</script>
</body>
</html>
