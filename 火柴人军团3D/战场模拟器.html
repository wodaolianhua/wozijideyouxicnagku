<!DOCTYPE html>
<html lang="zh">
<head>

<title>现代战争 · 大战场AI模拟</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232563eb'/%3E%3Cpath d='M8 22 L16 10 L24 22 Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e14;
    font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; color:#e6e6e6; }
  canvas { display:block; }

  /* ---------- 开始界面 ---------- */
  #menu {
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #16233a 0%, #070a10 70%);
  }
  #menu h1 {
    font-size:44px; letter-spacing:8px; font-weight:900;
    background:linear-gradient(180deg,#7dd3fc,#2563eb);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 0 40px rgba(59,130,246,.4);
  }
  #menu .sub { color:#7c8aa0; margin-top:8px; letter-spacing:3px; font-size:13px; }
  .menu-block { margin-top:34px; text-align:center; }
  .menu-label { color:#9fb0c7; font-size:13px; letter-spacing:2px; margin-bottom:12px; }
  .opt-row { display:flex; gap:12px; justify-content:center; }
  .opt {
    padding:12px 22px; border:2px solid #2b3a52; border-radius:12px;
    background:rgba(20,30,46,.7); color:#c7d2e0; cursor:pointer;
    font-size:15px; font-weight:600; transition:.18s; min-width:76px; text-align:center;
  }
  .opt:hover { border-color:#3b82f6; color:#fff; transform:translateY(-2px); }
  .opt.active { border-color:#3b82f6; background:rgba(59,130,246,.22); color:#fff;
    box-shadow:0 0 22px rgba(59,130,246,.45); }
  #startBtn {
    margin-top:46px; padding:16px 70px; border:none; border-radius:40px;
    font-size:19px; font-weight:800; letter-spacing:6px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    box-shadow:0 8px 30px rgba(37,99,235,.5); transition:.2s;
  }
  #startBtn:hover { transform:scale(1.05); box-shadow:0 12px 40px rgba(37,99,235,.7); }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
  #topbar {
    position:absolute; top:0; left:0; right:0; height:52px;
    background:linear-gradient(180deg,rgba(8,12,20,.92),rgba(8,12,20,.55));
    border-bottom:1px solid rgba(59,130,246,.25);
    display:flex; align-items:center; padding:0 18px; gap:20px;
    pointer-events:auto;
  }
  #topbar .brand { color:#7dd3fc; font-weight:800; letter-spacing:3px; font-size:15px; }
  #factionStats { display:flex; gap:14px; margin-left:auto; }
  .fstat {
    display:flex; align-items:center; gap:7px; padding:5px 12px; border-radius:20px;
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); font-size:13px;
    transition:.3s;
  }
  .fstat.dead { opacity:.3; filter:grayscale(1); }
  .fdot { width:11px; height:11px; border-radius:50%; box-shadow:0 0 8px currentColor; }
  .fcount { font-weight:800; font-variant-numeric:tabular-nums; }
  #btns { display:flex; gap:8px; margin-left:14px; }
  .hbtn {
    pointer-events:auto; padding:7px 14px; border-radius:9px; cursor:pointer;
    background:rgba(30,41,59,.85); border:1px solid #334155; color:#cbd5e1;
    font-size:13px; font-weight:600; transition:.15s; white-space:nowrap;
  }
  .hbtn:hover { background:#334155; color:#fff; }
  .hbtn.on { background:#2563eb; border-color:#3b82f6; color:#fff; }

  /* 雷达 */
  #radarBox {
    position:absolute; left:16px; bottom:16px; width:170px; height:170px;
    background:rgba(6,12,20,.72); border:1px solid rgba(59,130,246,.35);
    border-radius:10px; padding:6px;
  }
  #radarBox .rtitle { font-size:10px; color:#7dd3fc; letter-spacing:2px; text-align:center; margin-bottom:3px; }
  #radar { width:100%; height:150px; display:block; }

  /* 情报中心 */
  #intel {
    position:absolute; right:16px; top:64px; width:224px;
    background:rgba(6,12,20,.74); border:1px solid rgba(59,130,246,.35);
    border-radius:10px; padding:10px 12px; font-size:12px;
  }
  #intel h3 { font-size:11px; color:#7dd3fc; letter-spacing:2px; margin-bottom:8px; font-weight:700; }
  .irow { display:flex; align-items:center; gap:6px; margin:7px 0; }
  .irow .nm { width:32px; font-weight:600; }
  .ibar { flex:1; height:6px; background:rgba(255,255,255,.09); border-radius:3px; overflow:hidden; }
  .ibar i { display:block; height:100%; width:0%; transition:width .4s; border-radius:3px; }
  .irow .cnt { width:22px; text-align:right; font-variant-numeric:tabular-nums; color:#c7d2e0; }
  .stance { font-size:10px; padding:1px 6px; border-radius:6px; background:rgba(255,255,255,.12); color:#e6e6e6; }
  #log { margin-top:8px; border-top:1px solid rgba(255,255,255,.1); padding-top:6px; }
  #log div { font-size:10.5px; color:#9fb0c7; margin:2px 0; line-height:1.4; }

  /* 单位档案（看算法） */
  #inspector {
    position:absolute; right:16px; bottom:16px; width:224px; display:none;
    background:rgba(6,12,20,.8); border:1px solid rgba(255,212,121,.45);
    border-radius:10px; padding:10px 12px; font-size:12px;
  }
  #inspector h3 { font-size:11px; color:#ffd479; letter-spacing:2px; margin-bottom:7px; font-weight:700; }
  #inspector .kv { display:flex; justify-content:space-between; margin:3px 0; color:#c7d2e0; }
  #inspector .kv b { color:#fff; font-weight:600; }

  /* 浮动伤害数字 */
  .dmgNum {
    position:fixed; font-size:13px; font-weight:900; pointer-events:none; z-index:15;
    text-shadow:0 1px 4px rgba(0,0,0,0.9),0 0 6px currentColor;
    animation:dmgFly 1.1s ease-out forwards;
    transform:translateX(-50%);
    white-space:nowrap;
  }
  @keyframes dmgFly {
    0%   { opacity:1; transform:translateX(-50%) translateY(0px) scale(1); }
    20%  { opacity:1; transform:translateX(-50%) translateY(-8px) scale(1.1); }
    100% { opacity:0; transform:translateX(-50%) translateY(-44px) scale(0.7); }
  }

  /* 击杀播报 */
  #killfeed {
    position:absolute; left:50%; top:120px; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    pointer-events:none; z-index:12;
  }
  .kf {
    background:rgba(6,12,20,.78); border:1px solid rgba(255,255,255,.12);
    border-radius:8px; padding:4px 14px; font-size:12px; letter-spacing:0.5px;
    animation:kfFade 3.2s ease-out forwards;
    white-space:nowrap;
  }
  @keyframes kfFade {
    0%   { opacity:0; transform:translateY(-8px) scale(0.92); }
    8%   { opacity:1; transform:translateY(0) scale(1); }
    70%  { opacity:1; }
    100% { opacity:0; transform:translateY(-5px); }
  }
  .kf .at { color:#9fb0c7; }
  .kf .kf { color:#e2e8f0; }

  /* 战斗激烈指示器 */
  #intensity {
    position:absolute; top:58px; left:50%; transform:translateX(-50%);
    background:rgba(6,12,20,.7); border:1px solid rgba(59,130,246,.2);
    border-radius:12px; padding:2px 12px; font-size:11px; color:#9fb0c7;
    letter-spacing:1px; pointer-events:none; transition:opacity .5s;
  }
  #intensity.hot { color:#ef4444; border-color:rgba(239,68,68,.4); }
  #intensity.warm { color:#fbbf24; border-color:rgba(251,191,36,.3); }

  /* 瞄准线 */
  #aimLine { position:fixed; inset:0; pointer-events:none; z-index:14; }

  /* 瞄准点 */
  .aimDot {
    position:fixed; width:10px; height:10px; border-radius:50%;
    border:2px solid; pointer-events:none; z-index:15;
    transform:translate(-50%,-50%);
    animation:aimPulse .9s ease-out forwards;
  }
  @keyframes aimPulse {
    0%   { opacity:1; transform:translate(-50%,-50%) scale(1); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(3); }
  }

  #tips {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(8,12,20,.7); border:1px solid rgba(255,255,255,.08);
    padding:8px 20px; border-radius:20px; font-size:12px; color:#9fb0c7; letter-spacing:1px;
  }
  #tips b { color:#7dd3fc; }

  #phase {
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    font-size:13px; letter-spacing:3px; color:#ffd479; font-weight:700;
    text-shadow:0 0 16px rgba(255,180,0,.45);
  }
  #banner {
    position:absolute; top:92px; left:50%; transform:translateX(-50%);
    font-size:15px; letter-spacing:4px; color:#ffd479; font-weight:700;
    text-shadow:0 0 20px rgba(255,180,0,.5); opacity:0; transition:opacity .4s;
  }

  /* 结算 */
  #result {
    position:fixed; inset:0; z-index:60; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:16px;
    background:rgba(4,8,14,.82); backdrop-filter:blur(4px);
  }
  #result.show { display:flex; }
  #result .rt { font-size:52px; font-weight:900; letter-spacing:6px; }
  #result .rs { color:#9fb0c7; letter-spacing:2px; }
  #result button {
    margin-top:14px; padding:14px 54px; border:none; border-radius:36px; cursor:pointer;
    font-size:16px; font-weight:800; letter-spacing:4px; color:#fff;
    background:linear-gradient(135deg,#2563eb,#1d4ed8); box-shadow:0 8px 26px rgba(37,99,235,.5);
  }

  #loader { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
    background:#070a10; color:#7dd3fc; letter-spacing:4px; font-size:15px; text-align:center; }
</style>

<script type="module">
import * as THREE from 'three';

const MAP_HALF   = 2200;     // 地图半径（方形）
const ISLAND_R   = 1150;     // 主岛半径（陆地）
const NAVAL_IN   = 1200;     // 海域内径（主岛外围）
const NAVAL_OUT  = 2070;     // 海域外径
const GROUND_Y   = 1.0;      // 地面基准高度（地形以此起伏）

// 高山：可攀爬的真实地形（非尖刺锥子），高斯山体、坡度缓和
const MOUNTAINS = [
  {x:-430, z: 270, r:215, h:300},
  {x: 360, z:-430, r:235, h:335},
  {x: 540, z: 440, r:175, h:240},
  {x:-570, z:-270, r:205, h:290},
  {x:  90, z: 560, r:155, h:205},
  {x:-210, z:-570, r:195, h:265},
  {x: 710, z:-170, r:165, h:220},
  {x:-690, z: 470, r:180, h:250},
];

// 地形高度场：平地 + 丘陵 + 可攀爬高山；不规则海岸沉入海中；河道下陷露水
function terrainHeight(x, z) {
  let h = GROUND_Y;
  h += 5*Math.sin(x*0.004)*Math.cos(z*0.004) + 4*Math.sin((x+z)*0.003) + 3*Math.cos((x-z)*0.005);
  if (h < -0.5) h = -0.5;            // 防止丘陵把地面压成海平面以下的坑洞
  for (const m of MOUNTAINS) {
    const dx = x-m.x, dz = z-m.z;
    h += m.h * Math.exp(-(dx*dx+dz*dz)/(2*m.r*m.r));
  }
  if (inWaterway(x, z)) h = Math.min(h, -1.6);
  const r = Math.hypot(x, z);
  const ang = Math.atan2(z, x);
  const shore = ISLAND_R - 34*Math.sin(ang*3) - 22*Math.sin(ang*5 + 1.3);
  if (r > shore) {
    const t = Math.min(1, (r - shore) / 70);
    h = h*(1-t) + (-2.0)*t;
  }
  return h;
}

// 散布海中的小岛（海军活动 / 视觉层次），主战场仍在主岛
const SMALL_ISLANDS = [
  { x:-1560, z: 980, r:430 },
  { x: 1620, z:-780, r:360 },
  { x:  740, z:1770, r:330 },
];


const FACTION_COLORS = [0x3b82f6, 0xef4444, 0x22c55e, 0xeab308, 0xa855f7];
const FACTION_NAMES  = ['蓝军', '红军', '绿军', '黄军', '紫军'];
function hex(c){ return '#'+c.toString(16).padStart(6,'0'); }

// ============================================================
//  兵种定义（血量更高 / 节奏更慢 = 更像人）
//    vision：视野半径，看不到目标就不开火
// ============================================================
const DEFS = {
  infantry : { name:'步兵',   domain:'land',  targets:['land'],              hp:120, dmg:7,   speed:10, range:32,   cd:1.0, vision:240, weapon:'gun',      big:false, alt:0   },
  tank     : { name:'坦克',   domain:'land',  targets:['land'],              hp:900, dmg:44,  speed:7,  range:58,   cd:2.6, vision:320, weapon:'shell',    big:false, alt:0   },
  artillery: { name:'火炮',   domain:'land',  targets:['land'],              hp:420, dmg:85,  speed:4,  range:210,  cd:6.0, vision:360, weapon:'shell',    big:false, alt:0   },
  rocket   : { name:'火箭炮', domain:'land',  targets:['land'],              hp:260, dmg:55,  speed:6,  range:300,  cd:8.0, vision:300, weapon:'rocket',   big:false, alt:0   },
  sam      : { name:'防空弹', domain:'land',  targets:['air'],               hp:290, dmg:62,  speed:8,  range:180,  cd:4.5, vision:320, weapon:'sam',      big:false, alt:0   },
  aa       : { name:'高炮',   domain:'land',  targets:['air'],               hp:320, dmg:28,  speed:8,  range:120,  cd:0.5, vision:280, weapon:'gun',      big:false, alt:0   },
  heli     : { name:'直升机', domain:'air',   targets:['land','air'],        hp:360, dmg:24,  speed:16, range:75,   cd:1.4, vision:360, weapon:'missile',  big:false, alt:22  },
  fighter  : { name:'战斗机', domain:'air',   targets:['air'],               hp:280, dmg:52,  speed:42, range:130,  cd:2.8, vision:460, weapon:'missile',  big:false, alt:52  },
  bomber   : { name:'轰炸机', domain:'air',   targets:['land'],              hp:520, dmg:130, speed:20, range:100,  cd:5.5, vision:400, weapon:'bomb',     big:false, alt:70  },
  warship  : { name:'驱逐舰', domain:'naval', targets:['naval','land','air'], hp:2200,dmg:75, speed:6,  range:240,  cd:4.0, vision:440, weapon:'shell',    big:false, alt:0   },
  submarine: { name:'潜艇',   domain:'naval', targets:['naval'],             hp:700, dmg:130, speed:5,  range:180,  cd:5.5, vision:320, weapon:'torpedo',  big:false, alt:0   },
};

const ARMY = {
  small : { infantry:6,  tank:3,  artillery:1, rocket:1, sam:1, aa:1, heli:2, fighter:1, bomber:1, warship:1, submarine:1 },
  medium: { infantry:12, tank:6,  artillery:2, rocket:2, sam:1, aa:1, heli:3, fighter:2, bomber:1, warship:2, submarine:1 },

// 布阵站位：rf=离岛心的半径系数；spacing=同排横向间距；alt=高度
const FORM = {
  infantry : { rf:0.38, spacing:6 },
  tank     : { rf:0.50, spacing:11 },
  aa       : { rf:0.56, spacing:11 },
  sam      : { rf:0.54, spacing:11 },

// ============================================================
//  全局
// ============================================================
let scene, camera, renderer, controls, clock;
let commandLayer;            // 指挥标记图层（集结点 + 进攻方向箭头）
let factions = [];            // {id,color,name,units[],baseAngle,basePos,stance,focus,sneak,cdrT,commanders[]}
let commanders = [];          // 全局指挥员列表，方便遍历
let projectiles = [], fxList = [], flagList = [];
let phase = 'menu';           // menu | battle | end
let speedMul = 1, paused = false;
let followUnit = null, selectedUnit = null;
let visionOn = false;
const coverBlockers = [];    // 地形遮挡物：{x,z,r,h,type:'mountain'|'bunker'}
const trenches = [];         // 战壕：{x,z,r} 提供减伤
const waterways = [];        // 河道：{cx,cz,angle,length,width}
const bridges = [];          // 桥：{x,z,angle,across,deckW,hp,maxHp,dead,mesh,waterway}
let factionCount = 3, scaleKey = 'medium';
const raycaster = new THREE.Raycaster();
const tmpV = new THREE.Vector3();
let camTween = null;
let screenShake = { x:0, y:0, mag:0, decay:0.85 };
let totalKills = 0;  // 本局总击杀
let floatNums = [];  // 浮动伤害数字 DOM 元素
let incomingDamage = new Map(); // unitId -> 已预订伤害（集火协调）

// 视野环（所有单位共用一份几何，按视野半径缩放）
const visionRingGeo = new THREE.RingGeometry(0.985, 1.0, 48);

// ============================================================
//  材质缓存
// ============================================================
const matCache = {};
function M(color, opts={}) {
  const key = color + JSON.stringify(opts);
  if (!matCache[key]) matCache[key] = new THREE.MeshStandardMaterial({ color, roughness:0.72, metalness:0.25, ...opts });
  return matCache[key];
}
function basic(color, opts={}) {
  const key = 'b'+color+JSON.stringify(opts);
  if (!matCache[key]) matCache[key] = new THREE.MeshBasicMaterial({ color, ...opts });
  return matCache[key];
}

// ============================================================
//  音效引擎（Web Audio 合成，无需外部音频文件）
// ============================================================
const SFX = (() => {
  let ctx=null, master=null, muted=false, ready=false, noiseBuf=null;
  let budget=0, budgetT=0;
  const last={};
  const CD={ gun:0.045, shell:0.055, missile:0.08, bomb:0.12, torpedo:0.12, explosion:0.05, hit:0.07 };

  function ensure(){
    if (ready) return ctx;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate*0.6);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
      ready = true;
      return ctx;
    }catch(e){ ready=false; return null; }
  }
  function init(){ ensure(); if (ctx && ctx.state==='suspended') { try{ ctx.resume(); }catch(e){} } }
  function setMuted(m){ muted=m; if (master) master.gain.value = m?0:0.5; }

  function gate(kind, pos, maxD){
    if (!ready || muted) return 0;
    const now = performance.now()/1000;
    const cd = CD[kind] || 0.05;
    if (last[kind] && now-last[kind] < cd) return 0;
    if (now-budgetT > 0.045){ budget=7; budgetT=now; }
    if (budget<=0) return 0;
    budget--; last[kind]=now;
    let v = 1;
    if (pos && camera){
      const d = camera.position.distanceTo(pos);
      v = Math.max(0.05, Math.min(1, 1 - d/(maxD||700)));
    }
    return v;
  }
  function env(g,t0,dur,peak,atk){
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+(atk||0.006));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  }
  function tone(freq,dur,type,peak,v,sweep,delay){
    const t0=ctx.currentTime+(delay||0);
    const o=ctx.createOscillator(); o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t0);
    if(sweep) o.frequency.exponentialRampToValueAtTime(Math.max(1,sweep),t0+dur);
    const g=ctx.createGain(); env(g,t0,dur,peak*v);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+0.03);
  }
  function noiseB(dur,ftype,freq,peak,v,sweep,q,delay){
    const t0=ctx.currentTime+(delay||0);
    const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(freq,t0); f.Q.value=q||1;
    if(sweep) f.frequency.exponentialRampToValueAtTime(Math.max(20,sweep),t0+dur);
    const g=ctx.createGain(); env(g,t0,dur,peak*v);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0+dur+0.03);
  }

  return {
    init, setMuted,
    isMuted(){ return muted; },
    toggle(){ setMuted(!muted); return muted; },

    weapon(kind,pos){
      const v = gate(kind,pos,700); if(!v) return;
      if(kind==='gun'){ noiseB(0.05,'highpass',1000,0.22,v,1400,0.7); tone(180,0.06,'square',0.12,v,70); }
      else if(kind==='shell'){ tone(150,0.34,'sine',0.5,v,42); noiseB(0.28,'lowpass',700,0.34,v,140); }
      else if(kind==='missile'){ noiseB(0.42,'bandpass',420,0.3,v,1900,1.1); }
      else if(kind==='bomb'){ tone(820,0.55,'sine',0.14,v,260); noiseB(0.5,'bandpass',900,0.12,v,300,1); }
      else if(kind==='torpedo'){ tone(95,0.5,'sine',0.32,v,50); noiseB(0.45,'lowpass',400,0.24,v,90); }
    },
    boom(size,pos){
      const v = gate('explosion',pos,780); if(!v) return;
      const s = Math.min(2, (size||14)/16);
      tone(95, 0.7*(0.8+s*0.3),'sine',0.55,v,28);
      tone(52, 0.95,'triangle',0.35,v,24,0.02);
      noiseB(0.65,'lowpass',1000,0.45,v,120,0.8);
    },
    hit(pos){
      const v = gate('hit',pos,320); if(!v) return;
      noiseB(0.05,'highpass',1800,0.15,v,2400,0.8);
    },
    ui(){ if(!ready||muted) return; tone(680,0.07,'square',0.12,1,900); },
    banner(){ if(!ready||muted) return; tone(520,0.12,'sine',0.16,1,760); tone(784,0.16,'sine',0.14,1,784,0.09); },
    victory(win){
      if(!ready||muted) return;
      const notes = win ? [523,659,784,1047] : [392,330,262];
      notes.forEach((f,i)=> tone(f,0.35,'triangle',0.22,1,null,i*0.16));
    }
  };
})();

// ============================================================
//  初始化
// ============================================================
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1018);
  scene.fog = new THREE.Fog(0x16243a, 1600, 4400);

  // 指挥标记图层（集结点 + 进攻方向箭头），按阵营着色
  commandLayer = new THREE.Group();
  scene.add(commandLayer);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  document.body.appendChild(renderer.domElement);

  camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 1, 4000);
  camera.position.set(520, 1850, 1850);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 30;
  controls.maxDistance = 4400;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.target.set(0, 0, 0);
  controls.screenSpacePanning = false;
  controls.panSpeed = 1.2;
  // 操控改键：左键旋转、中键平移、右键无浏览器菜单冲突
  controls.mouseButtons = {
    LEFT: THREE.MOUSE.ROTATE,
    MIDDLE: THREE.MOUSE.PAN,
    RIGHT: THREE.MOUSE.DOLLY
  };
  window.camera = camera;
  window.controls = controls;
  // 调试钩子：供自动化验证读取战场状态（不影响游戏逻辑）
  window.__game = {
    get factions(){ return factions; },
    get phase(){ return phase; },
    get simTime(){ return simTime; },
    isWaterAt, terrainHeight, SMALL_ISLANDS,
    get bridges(){ return bridges; },
  };

  // 光照
  scene.add(new THREE.HemisphereLight(0xc8d8ee, 0x4a5a30, 0.9));
  const sun = new THREE.DirectionalLight(0xfff2d8, 1.5);
  sun.position.set(300, 520, 240);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const d = 560;
  Object.assign(sun.shadow.camera, { left:-d, right:d, top:d, bottom:-d, near:10, far:1600 });
  sun.shadow.bias = -0.0006;          // 抗阴影闪烁
  sun.shadow.normalBias = 0.9;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x3b82f6, 0.5);
  rim.position.set(-300, 180, -240);
  scene.add(rim);

  buildWorld();

  clock = new THREE.Clock();
  addEventListener('resize', onResize);

  // 双击单位 -> 跟随视角（只响应左键，避免右键/中键误触）
  renderer.domElement.addEventListener('dblclick', e=>{
    if (e.button !== 0) return;
    const u = pickUnit(e);
    if (u) {
      followUnit = u;
      const dist = u.def.domain==='air' ? 90 : u.def.domain==='naval' ? 120 : 85;
      const off = new THREE.Vector3(0, dist*0.7, dist);
      flyTo(u.pos.clone().add(off), u.pos.clone(), 0.9);
      banner(`跟随：${u.faction.name} ${u.def.name}`);
    } else {
      followUnit = null;
      banner('已解除跟随');
    }
  });

  // 单击单位 -> 打开档案（只响应左键）
  let downXY=null, downBtn=null;
  renderer.domElement.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; downBtn=e.button; });
  renderer.domElement.addEventListener('click', e=>{
    if (!downXY || downBtn !== 0 || e.button !== 0) { downXY=null; downBtn=null; return; }
    const moved = Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]);
    downXY=null; downBtn=null;
    if (moved > 5 || phase==='menu') return;
    const u = pickUnit(e);
    selectedUnit = u || null;
    renderInspector();
  });

  renderer.setAnimationLoop(loop);
  document.getElementById('loader').style.display = 'none';
}

function pickUnit(e){
  const m = new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m, camera);
  const objs = [];
  for (const f of factions) for (const u of f.units) if (!u.dead) objs.push(u.mesh);
  const hits = raycaster.intersectObjects(objs, true);
  if (hits.length) return findUnitByMesh(hits[0].object);
  return null;
}

// ============================================================
//  世界搭建（修复 z-fighting 闪烁：分层高度错开）
// ============================================================
function buildWorld() {
  const SW = MAP_HALF*2.6;

  // 海洋
  const ocean = new THREE.Mesh(
    new THREE.PlaneGeometry(SW, SW, 1, 1),
    new THREE.MeshStandardMaterial({ color:0x0d3b66, roughness:0.28, metalness:0.55 })
  );
  ocean.rotation.x = -Math.PI/2;
  ocean.position.y = -2.0;
  ocean.receiveShadow = true;
  scene.add(ocean);

  // 海中大网格波纹（静态）
  const wgrid = new THREE.GridHelper(SW, 90, 0x1b5a8c, 0x14456b);
  wgrid.position.y = -1.6;
  scene.add(wgrid);

  // 静态波浪线（ faint，不再做呼吸动画，避免外圈一直晃眼）
  for (let r=0;r<7;r++) {
    const wave = new THREE.Mesh(
      new THREE.TorusGeometry(ISLAND_R+90+r*70, 0.5, 4, 160),
      new THREE.MeshBasicMaterial({ color:0x1b6a9c, transparent:true, opacity:0.05 })
    );
    wave.rotation.x = -Math.PI/2;
    wave.position.y = -1.3;
    scene.add(wave);
  }

  // 主岛：浅滩 / 沙滩 / 陆地 / 草地 四层，顶面高度依次错开
  const shallows = new THREE.Mesh(
    new THREE.CylinderGeometry(ISLAND_R+40, ISLAND_R+70, 6, 128, 1),
    new THREE.MeshStandardMaterial({ color:0x1a5f9a, roughness:0.6, metalness:0.3, transparent:true, opacity:0.6 })
  );
  shallows.position.y = -1.8;
  scene.add(shallows);

  const beach = new THREE.Mesh(
    new THREE.CylinderGeometry(ISLAND_R+60, ISLAND_R+90, 10, 128, 1),
    M(0xc2a878, { roughness:0.95 })
  );
  beach.position.y = -9.0; beach.receiveShadow = true; scene.add(beach);

  const land = new THREE.Mesh(
    new THREE.CylinderGeometry(ISLAND_R+20, ISLAND_R+60, 10, 128, 1),
    M(0x5d8a44, { roughness:0.95 })
  );
  land.position.y = -8.5; land.receiveShadow = true; scene.add(land);

  // 水路 / 河道：先注册（地形据此下陷成河床），地面单位绕行、海军通航
  addWaterway(0, -ISLAND_R*0.15, Math.PI/4.2, ISLAND_R*1.5, 70);
  addWaterway(ISLAND_R*0.12, 0, -Math.PI/5, ISLAND_R*1.3, 54);
  addWaterway(-ISLAND_R*0.10, ISLAND_R*0.10, Math.PI/9, ISLAND_R*1.1, 48);

  // 桥梁：陆军过河干道（可被炸毁，炸毁后只能泅渡）
  addBridge(waterways[0], -300);
  addBridge(waterways[0],  300);
  addBridge(waterways[1],  40);
  addBridge(waterways[2], -60);

  // 地形：起伏丘陵 + 可攀爬高山 + 不规则海岸 + 河道河床（替代原平面草地）
  buildTerrain();

  // 散布海中的小岛（海军活动 / 视觉层次）
  SMALL_ISLANDS.forEach(is => addSmallIsland(is.x, is.z, is.r));

  addIslandDecor();

  // 高山：登记为视野遮挡物（山体已由 terrainHeight 体现为可攀登山峰）
  buildMountains();
}

function addSmallIsland(cx, cz, r) {
  // 水下基座（暗色裙边，沉到海床，让岛从水里"长"出来而不是漂着）
  const base = new THREE.Mesh(new THREE.CylinderGeometry(r+46, r+95, 9, 48, 1), M(0x3a5a52,{roughness:1}));
  base.position.set(cx, -6.5, cz); scene.add(base);
  // 浅滩过渡环（半透水色，模拟岸线没入海中的渐变）
  const shallow = new THREE.Mesh(new THREE.CylinderGeometry(r+30, r+52, 4, 48, 1),
    new THREE.MeshStandardMaterial({ color:0x2a7a9a, roughness:0.5, metalness:0.3, transparent:true, opacity:0.55 }));
  shallow.position.set(cx, -3.4, cz); scene.add(shallow);
  // 沙滩坡（大底小顶，坡面没入水面以下，看不见"圆盘边"）
  const beach = new THREE.Mesh(new THREE.CylinderGeometry(r+8, r+34, 12, 48, 1), M(0xc2a878,{roughness:0.95}));
  beach.position.set(cx, -5.4, cz); beach.receiveShadow = true; scene.add(beach);
  const grass = new THREE.Mesh(new THREE.CylinderGeometry(r, r+12, 12, 48, 1), M(0x4f8a40,{roughness:0.95}));
  grass.position.set(cx, -4.4, cz); grass.receiveShadow = true; scene.add(grass);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r*0.9, r, 1.2, 48, 1), M(0x568a42,{roughness:0.95}));
  top.position.set(cx, 0.4, cz); top.receiveShadow = true; scene.add(top);
  // 岸边礁石（遮一遮水线交界，也是抢滩掩体）
  for (let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2;
    const rr = r + 6 + Math.random()*14;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5+Math.random()*2.5, 0), M(0x5f6b6b,{roughness:1}));
    rock.position.set(cx+Math.cos(a)*rr, -1.2+Math.random()*1.4, cz+Math.sin(a)*rr);
    rock.rotation.set(Math.random(),Math.random(),Math.random());
    rock.castShadow = true; scene.add(rock);
  }
  for (let i=0;i<7;i++){
    const a=Math.random()*Math.PI*2, rr=Math.random()*r*0.7;
    const t=makeTree(); t.position.set(cx+Math.cos(a)*rr, GROUND_Y, cz+Math.sin(a)*rr); scene.add(t);
  }
}

// 高山：山体已由 terrainHeight 体现为可攀爬的真实山峰；此处仅登记为视野遮挡物
function buildMountains() {
  MOUNTAINS.forEach(m=>{
    coverBlockers.push({ x:m.x, z:m.z, r:m.r*0.85, h:m.h, type:'mountain' });
  });
}

function addIslandDecor() {
  // 树林斑块：聚类种植，形成战场地形掩护带
  const clusters = [
    {x:-520,z: 180,r:170,n:45}, {x:-220,z: 460,r:160,n:40},
    {x: 420,z:-520,r:180,n:48}, {x: 620,z: 120,r:150,n:35},
    {x:-120,z:-620,r:160,n:38}, {x: 300,z: 500,r:140,n:32},
    {x:-700,z:-380,r:130,n:28}, {x: 760,z: 560,r:120,n:26},
  ];
  for (const c of clusters) placeTreeCluster(c.x, c.z, c.r, c.n);
  // 沿主岛边缘稀疏点缀
  for (let i=0;i<90;i++) {
    const a = Math.random()*Math.PI*2;
    const r = ISLAND_R*0.78 + Math.random()*ISLAND_R*0.16;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if (inWaterway(x,z)) continue;
    let blocked=false;
    for (const b of coverBlockers) if (b.type==='bunker' && Math.hypot(x-b.x,z-b.z)<b.r+12) { blocked=true; break; }
    if (blocked) continue;
    const t = makeTree(); t.position.set(x,terrainHeight(x,z),z); t.rotation.y=Math.random()*Math.PI*2; scene.add(t);
  }
  // 小岛补树林
  SMALL_ISLANDS.forEach(is=>{
    for (let i=0;i<22;i++) {
      const a=Math.random()*Math.PI*2, rr=Math.random()*is.r*0.75;
      const x=is.x+Math.cos(a)*rr, z=is.z+Math.sin(a)*rr;
      const t=makeTree(); t.position.set(x,GROUND_Y,z); t.rotation.y=Math.random()*Math.PI*2; scene.add(t);
    }
  });
  // 岩石
  for (let i=0;i<80;i++) {
    const p = randInIsland(20, ISLAND_R-20);
    const r = new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*3,0), M(0x6b7280,{roughness:1}));
    r.position.set(p.x, terrainHeight(p.x,p.z)+1, p.z);
    r.rotation.set(Math.random(),Math.random(),Math.random());
    r.castShadow = true; scene.add(r);
  }
  // 村镇建筑群
  const towns = [ [320,200],[-360,140],[100,-380],[-200,-260],[360,-140],[-80,300],[520,520],[-560,560] ];
  towns.forEach(([cx,cz]) => {
    for (let i=0;i<8;i++) {
      const b = makeBuilding();
      b.position.set(cx+(Math.random()-0.5)*90, terrainHeight(cx,cz), cz+(Math.random()-0.5)*90);
      scene.add(b);
    }
  });
  // 矮丘已由 terrainHeight 起伏体现，不再单独放置锥状丘陵
  // 碉堡（挡视野 + 减伤）
  for (let i=0;i<16;i++) {
    const p = randInIsland(130, ISLAND_R-130);
    const b = makeBunker();
    b.position.set(p.x, terrainHeight(p.x,p.z), p.z);
    b.rotation.y = Math.random()*Math.PI;
    scene.add(b);
    coverBlockers.push({ x:p.x, z:p.z, r:17, h:13, type:'bunker' });
  }
  // 战壕（减伤带）
  for (let i=0;i<8;i++) {
    const p = randInIsland(160, ISLAND_R-160);
    const tr = makeTrench();
    tr.position.set(p.x, terrainHeight(p.x,p.z), p.z);
    tr.rotation.y = Math.random()*Math.PI;
    scene.add(tr);
    trenches.push({ x:p.x, z:p.z, r:38 });
  }
}

function makeBunker() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(26, 12, 26), M(0x6b6f73,{roughness:0.95}));
  base.position.y = 6; base.castShadow = true; base.receiveShadow = true; g.add(base);
  const top = new THREE.Mesh(new THREE.BoxGeometry(20, 4, 20), M(0x565a5e,{roughness:0.95}));
  top.position.y = 13; g.add(top);
  // 射击孔（深色条）
  const slit = new THREE.Mesh(new THREE.BoxGeometry(20, 3, 2), M(0x1a1c1e));
  slit.position.set(0, 8, 13); g.add(slit);
  return g;
}

function makeTrench() {
  const g = new THREE.Group();
  const trough = new THREE.Mesh(new THREE.BoxGeometry(70, 4, 22), M(0x4a3f2e,{roughness:1}));
  trough.position.y = -1; g.add(trough);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(70, 2, 6), M(0x6b5a3a,{roughness:1}));
  lip.position.set(0, 1, 11); g.add(lip);
  const lip2 = lip.clone(); lip2.position.set(0,1,-11); g.add(lip2);
  return g;
}

function randInIsland(minR, maxR) {
  for (let attempt=0; attempt<8; attempt++) {
    const a = Math.random()*Math.PI*2;
    const r = minR + Math.random()*(maxR-minR);
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    let ok = true;
    for (const b of coverBlockers) {
      if (b.type==='mountain' && Math.hypot(x-b.x, z-b.z) < b.r+6) { ok=false; break; }
    }
    if (ok) return new THREE.Vector3(x, terrainHeight(x,z), z);
  }
  const a = Math.random()*Math.PI*2, r = minR + Math.random()*(maxR-minR);
  return new THREE.Vector3(Math.cos(a)*r, terrainHeight(Math.cos(a)*r, Math.sin(a)*r), Math.sin(a)*r);
}

function addWaterway(cx, cz, angle, length, width) {
  waterways.push({ cx, cz, angle, length, width });
  const g = new THREE.Group();
  // 河面抬高到接近草地顶面，颜色鲜亮，让人一眼看出是水
  const wl = new THREE.Mesh(
    new THREE.PlaneGeometry(width*0.98, length*0.98, 1, 12),
    new THREE.MeshStandardMaterial({ color:0x16a9e8, roughness:0.08, metalness:0.35,
      transparent:true, opacity:0.95 })
  );
  wl.rotation.x = -Math.PI/2;
  wl.position.y = 0.36;                 // 贴近草地顶面 0.4，只低一点避免 z-fighting
  wl.receiveShadow = true;
  g.add(wl);
  g.position.set(cx, 0, cz);

  shoal.position.y = 0.32;
  shoal.position.set(cx, 0.18, cz);
  shoal.rotation.y = angle;
  scene.add(shoal);

// ---- 桥梁：横跨河道的干道，陆军走桥不减速；可被爆炸炸毁 ----
function addBridge(w, offset) {
  // 河道长度方向（局部 Z）在世界中的朝向
  const dx = Math.sin(w.angle), dz = Math.cos(w.angle);
  const x = w.cx + dx*offset, z = w.cz + dz*offset;
  const across = w.width * 1.7, deckW = 18;
  const g = new THREE.Group();
  const deckMat = new THREE.MeshStandardMaterial({ color:0x7a6a4a, roughness:0.85, metalness:0.1 });
  const deck = new THREE.Mesh(new THREE.BoxGeometry(across, 1.4, deckW), deckMat);
  deck.position.y = 0.5; deck.castShadow = true; deck.receiveShadow = true; g.add(deck);
  // 护栏
  [-1,1].forEach(s=>{
    const rail = new THREE.Mesh(new THREE.BoxGeometry(across, 1.0, 0.6), deckMat);
    rail.position.set(0, 1.6, s*(deckW/2-0.4)); g.add(rail);
  });
  // 桥墩
  for (const px of [-across*0.3, 0, across*0.3]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 2.0, 4.5, 8), M(0x5a5f63,{roughness:0.9}));
    pillar.position.set(px, -1.6, 0); g.add(pillar);
  }
  g.position.set(x, 0, z);
  g.rotation.y = w.angle;
  scene.add(g);
  bridges.push({ x, z, angle:w.angle, across, deckW, hp:700, maxHp:700, dead:false, mesh:g, waterway:w });
}

// 点 (x,z) 是否在某座完好桥的面板范围内（返回该桥或 null）
function bridgeAt(x, z) {
  for (const b of bridges) {
    if (b.dead) continue;
    const dx = x - b.x, dz = z - b.z;
    const cos = Math.cos(-b.angle), sin = Math.sin(-b.angle);
    const lx = dx*cos - dz*sin, lz = dx*sin + dz*cos;
    if (Math.abs(lx) <= b.across/2 + 1 && Math.abs(lz) <= b.deckW/2 + 1) return b;
  }
  return null;
}

// 爆炸对桥的伤害（按到桥面板的最近距离判定）
function damageBridges(pos, size) {
  for (const b of bridges) {
    if (b.dead) continue;
    const dx = pos.x - b.x, dz = pos.z - b.z;
    const cos = Math.cos(-b.angle), sin = Math.sin(-b.angle);
    const lx = dx*cos - dz*sin, lz = dx*sin + dz*cos;
    const ex = Math.max(0, Math.abs(lx) - b.across/2);
    const ez = Math.max(0, Math.abs(lz) - b.deckW/2);
    if (Math.hypot(ex, ez) < size) {
      b.hp -= size * 9;
      if (b.hp <= 0) destroyBridge(b);
    }
  }
}

function destroyBridge(b) {
  b.dead = true;
  b.mesh.rotation.z = 0.32;          // 桥面垮塌倾斜
  b.mesh.position.y = -2.2;          // 沉入水中
  logEvent('一座桥梁被炸毁！该河段只能泅渡', 0xffd479);
  banner('桥梁被炸毁！');
}

// 陆军过桥寻路：直行路线要穿河时，若前方有活桥且代价可接受，先上桥
function routeViaBridge(unit, p) {
  if (unit.def.domain !== 'land' || unit.homeIsland) return p;
  if (unit._inWater) return p;                          // 已下水就直接游
  if (bridgeAt(unit.pos.x, unit.pos.z)) return p;       // 已在桥面继续走
  // 采样检测 pos→p 是否穿河
  let hit = null;
  for (let i=1;i<=8;i++){
    const x = unit.pos.x + (p.x-unit.pos.x)*i/8;
    const z = unit.pos.z + (p.z-unit.pos.z)*i/8;
    const w = inWaterway(x,z);
    if (w) { hit = w; break; }
  }
  if (!hit) return p;
  // 该河道上最近的活桥
  let best = null, bd = Infinity;
  for (const b of bridges) {
    if (b.dead || b.waterway !== hit) continue;
    const d = Math.hypot(b.x-unit.pos.x, b.z-unit.pos.z);
    if (d < bd) { bd = d; best = b; }
  }
  if (!best) return p;                                  // 桥已全毁 → 只能泅渡
  // 桥在背后 → 不值得回头，直接泅渡
  const dot = (best.x-unit.pos.x)*(p.x-unit.pos.x) + (best.z-unit.pos.z)*(p.z-unit.pos.z);
  if (dot < 0) return p;
  // 绕桥代价超过直渡 1.6 倍 → 直接泅渡
  const dp = Math.hypot(p.x-unit.pos.x, p.z-unit.pos.z);
  if (bd > dp * 1.6) return p;
  return new THREE.Vector3(best.x, 0, best.z);
}

// 地形网格：跟随 terrainHeight 起伏，按高度顶点着色（沙滩/草地/岩石/雪顶），河道着水色
function buildTerrain() {
  const S = ISLAND_R + 140;
  const seg = 200;
  const geo = new THREE.PlaneGeometry(S*2, S*2, seg, seg);
  geo.rotateX(-Math.PI/2);
  const pos = geo.attributes.position;
  const colors = [];
  const cSand=[0.78,0.69,0.50], cGrass=[0.43,0.66,0.29], cGrass2=[0.34,0.55,0.21],
        cRock=[0.47,0.43,0.35], cSnow=[0.92,0.94,0.96], cWater=[0.09,0.66,0.91];
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainHeight(x, z);
    pos.setY(i, y);
    let c;
    if (inWaterway(x, z)) c = cWater;
    else if (y < -0.5) c = cSand;
    else if (y < 55) c = cGrass;
    else if (y < 150) c = cGrass2;
    else if (y < 235) c = cRock;
    else c = cSnow;
    colors.push(c[0], c[1], c[2]);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.96, metalness:0.0 });
  const ground = new THREE.Mesh(geo, mat);
  ground.receiveShadow = true;
  scene.add(ground);
}
// 点 (x,z) 是否在旋转水道椭圆内（用于河道水深 / 涉水判定）
function inWaterway(x, z) {
  for (const w of waterways) {
    const dx = x - w.cx, dz = z - w.cz;
    const cos = Math.cos(-w.angle), sin = Math.sin(-w.angle);
    const lx = dx*cos - dz*sin;
    const ly = dx*sin + dz*cos;
    if ((lx*lx)/((w.width*0.55)**2) + (ly*ly)/((w.length*0.52)**2) <= 1) return w;
  }
  return null;
}

// ---- 渡水/登陆辅助：与 terrainHeight 共用同一条不规则岸线 ----
function shoreRadiusAt(ang) {
  return ISLAND_R - 34*Math.sin(ang*3) - 22*Math.sin(ang*5 + 1.3);
}
// 点 (x,z) 落在哪座小岛上（含边缘容差），不在则 null
function onSmallIsland(x, z) {
  for (const is of SMALL_ISLANDS) {
    if (Math.hypot(x-is.x, z-is.z) < is.r*0.98) return is;
  }
  return null;
}
// 点 (x,z) 是否为可涉水的水域：河道 或 主岛岸线外的海（小岛陆地除外）
function isWaterAt(x, z) {
  if (inWaterway(x, z)) return true;
  const r = Math.hypot(x, z);
  if (r > shoreRadiusAt(Math.atan2(z, x)) + 6) return !onSmallIsland(x, z);
  return false;
}

function makeTree() {
  const g = new THREE.Group();
  const h = 3.2 + Math.random()*2.8;               // 树干高度 3.2~6
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55,1.0,h,7), M(0x6b4a1f,{roughness:0.95}));
  trunk.position.y = h/2; trunk.castShadow = true; g.add(trunk);
  const palettes = [
    [0x1f6b2a,0x267a33,0x2f8a3c],
    [0x2d5a27,0x366e2f,0x3f8238],
    [0x3a6b1e,0x4a8028,0x5a9532],
    [0x1e5a3a,0x28704a,0x32865a],
  ];
  const pal = palettes[Math.floor(Math.random()*palettes.length)];
  for (let i=0;i<3;i++){
    const cr = 2.8 - i*0.55 + Math.random()*0.5;
    const ch = 4.0 - i*0.5 + Math.random()*0.8;
    const c = new THREE.Mesh(new THREE.ConeGeometry(cr, ch, 8), M(pal[i],{roughness:0.9}));
    c.position.y = h + 1.0 + i*(ch*0.55); c.castShadow = true; g.add(c);
  }
  g.scale.setScalar(0.75 + Math.random()*0.85);
  g.rotation.z = (Math.random()-0.5)*0.12;
  g.rotation.x = (Math.random()-0.5)*0.12;
  return g;
}

function placeTreeCluster(cx, cz, radius, count) {
  const placed = [];
  for (let i=0;i<count;i++) {
    const a = Math.random()*Math.PI*2;
    const r = Math.sqrt(Math.random())*radius;
    const x = cx + Math.cos(a)*r;
    const z = cz + Math.sin(a)*r;
    const distFromCenter = Math.hypot(x,z);
    if (distFromCenter < 45 || distFromCenter > ISLAND_R-12) continue;
    if (inWaterway(x,z)) continue;
    // 远离高山
    let blocked = false;
    for (const b of coverBlockers) {
      if (b.type==='mountain' && Math.hypot(x-b.x,z-b.z) < b.r+18) { blocked=true; break; }
      if (b.type==='bunker'  && Math.hypot(x-b.x,z-b.z) < b.r+14) { blocked=true; break; }
    }
    if (blocked) continue;
    // 远离战壕
    for (const t of trenches) if (Math.hypot(x-t.x,z-t.z) < t.r+10) { blocked=true; break; }
    if (blocked) continue;
    // 远离村镇建筑（粗略半径）
    const towns = [ [320,200],[-360,140],[100,-380],[-200,-260],[360,-140],[-80,300],[520,520],[-560,560] ];
    for (const [tx,tz] of towns) if (Math.hypot(x-tx,z-tz) < 65) { blocked=true; break; }
    if (blocked) continue;
    const t = makeTree();
    t.position.set(x, terrainHeight(x,z), z);
    t.rotation.y = Math.random()*Math.PI*2;
    scene.add(t);
    placed.push(t);
  }
  return placed;
}
